# name: Construire SMART-THERMOELEC MP v0.7

on:
  workflow_dispatch:
  push:
    branches:
      - principal
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compiler APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Verifier et extraire le projet
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : aucune archive ZIP trouvee."
            exit 1
          fi

          echo "Archive trouvee : $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          ANDROID_DIR="$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERREUR : projet Android introuvable."
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projet Android detecte : $ANDROID_DIR"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler APK Debug
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_PROJECT_DIR"

          gradle --no-daemon --stacktrace assembleDebug

      - name: Verifier APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$ANDROID_PROJECT_DIR" -type f -name 'app-debug.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERREUR : APK non genere."
            exit 1
          fi

          echo "APK genere avec succes : $APK"

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: SMART-THERMOELEC-MP-APK-v0.7
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
